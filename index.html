<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ilai Shimony – Coaching Portal</title>
    <meta name="apple-mobile-web-app-title" content="Ilai Shimony – Coaching Portal">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        color: #f8fafc;
        overflow-x: hidden;
        background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      h1, h2, h3, .brand-font {
        font-family: 'Oswald', sans-serif;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.2); }
        50% { box-shadow: 0 0 40px rgba(37, 99, 235, 0.5); }
      }
      .timer-active {
        animation: pulse-glow 2s infinite;
      }

      .hs-lab-gradient {
        background: radial-gradient(circle at center, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
      }
    </style>
